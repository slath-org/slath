{% extends "base.html" %}
{% block title %}Preview{% endblock %}
{% block content %}
<div class="narrow">
<h1>Preview</h1>
<p class="text-secondary">This is how your text will look. Go back in your browser to keep editing; your text is still there.</p>
{%- if empty %}
<p class="text-secondary">Nothing to preview.</p>
{%- else %}
<div class="markdown preview-box">{{ html }}</div>
{%- endif %}
</div>
{% endblock %}
