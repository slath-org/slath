{% extends "base.html" %}
{% block content %}
<div class="with-sidebar">
  <nav class="sidebar" aria-label="Settings">
    <ul>
      <li><a href="/-/settings/profile"{% if tab == "profile" %} aria-current="page"{% endif %}>Profile</a></li>
      <li><a href="/-/settings/security"{% if tab == "security" %} aria-current="page"{% endif %}>Password</a></li>
      <li><a href="/-/settings/sessions"{% if tab == "sessions" %} aria-current="page"{% endif %}>Sessions</a></li>
      <li><a href="/-/settings/keys"{% if tab == "keys" %} aria-current="page"{% endif %}>SSH keys</a></li>
      <li><a href="/-/settings/tokens"{% if tab == "tokens" %} aria-current="page"{% endif %}>Access tokens</a></li>
    </ul>
  </nav>
  <div class="sidebar-content">
    {%- if let Some(m) = message %}
    <div class="success-summary" role="status"><p>{{ m }}</p></div>
    {%- endif %}
    {% block settings %}{% endblock %}
  </div>
</div>
{% endblock %}
