{#- Commits as list rows (compare, conversation); the page sets `commits`. -#}
<ol class="item-list">
{%- for cm in commits %}
  <li class="item-row">
    <div class="item-main">
      <a class="item-title" href="/{{ header.namespace }}/{{ header.name }}/commit/{{ cm.oid }}">{{ cm.subject }}</a>
      <p class="item-meta text-secondary">{% call p::git_identity(ctx, cm.author, cm.author_account) %}{% endcall %} · {% call c::time(cm.time) %}{% endcall %} · <code>{{ cm.short }}</code></p>
    </div>
  </li>
{%- endfor %}
</ol>
