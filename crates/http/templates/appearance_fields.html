{#- The theme and density choices of the appearance menus (global bar
    and account menu). -#}
<input type="hidden" name="_csrf" value="{{ ctx.csrf_token() }}">
<input type="hidden" name="next" value="{{ ctx.here }}">
<fieldset>
  <legend>Theme</legend>
  <label class="menu-item"><input type="radio" name="theme" value="system"{% if ctx.theme.is_none() %} checked{% endif %}>{% call m::icon(ctx, "monitor") %}{% endcall %}System</label>
  <label class="menu-item"><input type="radio" name="theme" value="light"{% if ctx.theme == Some("light") %} checked{% endif %}>{% call m::icon(ctx, "sun") %}{% endcall %}Light</label>
  <label class="menu-item"><input type="radio" name="theme" value="dark"{% if ctx.theme == Some("dark") %} checked{% endif %}>{% call m::icon(ctx, "moon") %}{% endcall %}Dark</label>
</fieldset>
<fieldset>
  <legend>Density</legend>
  <label class="menu-item"><input type="radio" name="density" value="comfortable"{% if ctx.density == "comfortable" %} checked{% endif %}>Comfortable</label>
  <label class="menu-item"><input type="radio" name="density" value="compact"{% if ctx.density == "compact" %} checked{% endif %}>Compact</label>
</fieldset>
