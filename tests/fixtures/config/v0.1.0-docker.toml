#
# Container defaults. Override any key with SLATH__<SECTION>__<KEY>, e.g.
# SLATH__SERVER__PUBLIC_URL or SLATH__DATABASE__URL, or mount your own file
# at /etc/slath/slath.toml.

[server]
public_url = "http://localhost:3000"
listen = "0.0.0.0:3000"
metrics_listen = ""

[database]
url = "postgres://slath@postgres/slath"

[storage]
data_dir = "/var/lib/slath"
run_dir = "/run/slath"

[secrets]
master_key_file = "/var/lib/slath/master.key"

[git]
binary = "/opt/git/bin/git"

[log]
format = "json"
level = "info"
