#
# Every key a 0.1.0 configuration could set. Later releases must keep
# loading it (deprecated keys only warn).

[server]
public_url = "https://git.example.org"
listen = "127.0.0.1:3000"
trusted_proxies = ["127.0.0.1/32"]
usercontent_url = ""
metrics_listen = "127.0.0.1:9100"

[database]
url = "postgres://slath:x@localhost/slath"
max_connections = 20

[storage]
data_dir = "/var/lib/slath"
run_dir = "/run/slath"

[secrets]
master_key_file = "/etc/slath/master.key"
old_key_files = []

[git]
binary = "/usr/bin/git"
ssh_user = "git"
ssh_host = ""
ssh_port = 22

[auth]
registration = "disabled"
require_mfa_for_admins = true
session_idle_days = 14
session_absolute_days = 30
users_can_create_orgs = true

[smtp]
host = ""
port = 587
tls = "starttls"
username = ""
from = ""

[limits]
git_read_timeout = "30s"
git_transport_idle_timeout = "600s"
git_max_concurrent = 0
push_max_bytes = "2GiB"
repo_soft_quota_bytes = 0
render_max_file_bytes = "1MiB"
diff_max_files = 300
diff_max_lines = 20000
review_max_commits = 250
http_max_body_bytes = "10MiB"
attachment_max_bytes = "25MiB"
api_page_max = 100
archive_timeout = "120s"
archive_max_concurrent = 4
api_requests_per_hour = 5000
api_anonymous_requests_per_hour = 300
login_failures_per_account = 10
login_failures_per_ip = 50
ssh_key_lookups_per_second = 200
job_workers = 4

[ci]
enabled = false
max_concurrent_per_repo = 4
max_artifact_bytes_per_repo = "2GiB"
run_retention_days = 90

[maintenance]
reconcile_interval = "1h"
deleted_repo_days = 7
audit_retention_days = 365

[ui]
external_images = true

[upgrade]
auto_backup = false
check_for_updates = false

[log]
format = "json"
level = "info"
