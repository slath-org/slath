[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tests"]

[workspace.package]
version = "0.0.0"
authors = ["Erich Seifert <dev@erichseifert.de>"]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/slath-org/slath"
publish = false

[workspace.dependencies]
slath-core = { path = "crates/core" }
slath-db = { path = "crates/db" }
slath-git = { path = "crates/git" }
slath-markup = { path = "crates/markup" }
slath-auth = { path = "crates/auth" }
slath-service = { path = "crates/service" }
slath-http = { path = "crates/http" }
slath-ci = { path = "crates/ci" }

nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
tempfile = "3.27"
thiserror = "2.0"
time = "0.3"
tracing = "0.1"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
