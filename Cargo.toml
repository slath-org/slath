[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tests"]

[workspace.package]
version = "0.1.1"
authors = ["Erich Seifert <dev@erichseifert.de>"]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/slath-org/slath"
homepage = "https://slath.org"
publish = false

[workspace.dependencies]
slath-core = { path = "crates/core" }
slath-db = { path = "crates/db" }
slath-git = { path = "crates/git" }
slath-markup = { path = "crates/markup" }
slath-auth = { path = "crates/auth" }
slath-service = { path = "crates/service" }
slath-http = { path = "crates/http" }
slath-ci = { path = "crates/ci" }

ammonia = "4.2"
argon2 = "0.6"
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "multipart", "original-uri", "query", "tokio", "tracing"] }
base64 = "0.23"
comrak = { version = "0.59", default-features = false }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls"] }
jsonschema = { version = "0.60", default-features = false }
hkdf = "0.13"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user"] }
percent-encoding = "2.3"
proptest = "1.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ring = "0.17"
rustix = { version = "1.1", default-features = false, features = ["std", "net"] }
rust-embed = { version = "8.13", features = ["debug-embed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "parsing", "html", "regex-fancy"] }
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
tempfile = "3.27"
thiserror = "2.0"
time = "0.3"
tracing = "0.1"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"
toml_edit = "0.25"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3.5", default-features = false }
unicode-normalization = "0.1"
utoipa = { version = "6", features = ["time", "uuid"] }
webauthn-rs = { version = "0.6", default-features = false, features = ["danger-allow-state-serialisation", "conditional-ui", "resident-key-support"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Password hashing is far too slow unoptimized; tests sign in a lot.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
