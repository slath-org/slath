#
# Checks run when a release tag is pushed. A release without its
# upgrade notes (upgrade-notes/<version>.toml) fails here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  upgrade-notes:
    name: upgrade notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every release has upgrade notes matching its schema
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_upgrade_notes.py --tag "$TAG"
