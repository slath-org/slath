name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: just check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: slath
          POSTGRES_PASSWORD: slath
          POSTGRES_DB: slath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slath -d slath"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Queries are checked against the committed .sqlx/ data, not the live DB.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://slath:slath@localhost:5432/slath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install newest stable Git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get install -y --no-install-recommends git
          git --version
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest,cargo-deny,sqlx-cli,zizmor
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install pinned jj versions
        run: just tools
      - run: just migrate
      - run: just check

  # Three shards (Playwright --shard), so each stays well within its time.
  e2e:
    name: browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: slath
          POSTGRES_PASSWORD: slath
          POSTGRES_DB: slath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slath -d slath"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://slath:slath@localhost:5432/slath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install newest stable Git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get install -y --no-install-recommends git
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - name: Install pinned jj versions (the seeded jj-made stacks)
        run: just tools
      - run: just test-e2e --shard="$SHARD/3"
        env:
          SHARD: ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: target/e2e/
          retention-days: 7

  container:
    name: container install and offline rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install newest stable Git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get install -y --no-install-recommends git
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: container
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      - run: docker build -t slath:test .
      - run: just test-compose
      - run: just test-sandbox
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-results
          path: |
            target/compose.log
            target/sandbox.log
            target/e2e/offline-results/
          retention-days: 7

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/guards.sh
      - run: scripts/guards_test.sh

  # The workflows themselves, with the online audits (impostor commits,
  # known-vulnerable actions) that `just check` skips without a token.
  workflows:
    name: workflow audit (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,zizmor
      - run: just workflows
        env:
          GH_TOKEN: ${{ github.token }}

  msrv:
    name: MSRV build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV toolchain
        run: |
          msrv="$(sed -nE 's/^rust-version = "([^"]+)"/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +"$MSRV" check --workspace --all-targets --locked
        env:
          SQLX_OFFLINE: "true"
