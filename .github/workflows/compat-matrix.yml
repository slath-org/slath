#
# The Git/jj compatibility matrix: the whole client suite with the pinned
# Git (built from source) and every pinned jj version from
# tests/compat/versions.toml, plus the latest published jj release, so a
# new jj release is tested before anyone pins it. It covers the predicted
# jj IDs against each real jj binary, a jj run without change-id headers,
# mixed Git/jj teams, every merge request flow for Git-made, jj-made, and
# mixed stacks, forks, and tag pushes. No run installs client hooks or
# configuration. Nightly, and on changes to the pins or the change
# identity code. A red scheduled run opens or annotates a tracking issue
# and blocks the next release.
name: Git/jj matrix

on:
  pull_request:
    paths:
      - "tests/compat/versions.toml"
      - "crates/core/src/change_identity.rs"
      - "scripts/install-jj-latest.sh"
      - "scripts/compat_report.py"
      - ".github/workflows/compat-matrix.yml"
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  compat-matrix:
    name: Git and jj clients
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # open or annotate the tracking issue
    services:
      postgres:
        image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_USER: slath
          POSTGRES_PASSWORD: slath
          POSTGRES_DB: slath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slath -d slath"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://slath:slath@localhost:5432/slath
      SLATH_TOOLS_DIR: ${{ github.workspace }}/target/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: compat-tools-${{ runner.arch }}-${{ hashFiles('tests/compat/versions.toml') }}
      - name: Install the pinned Git
        run: |
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libexpat1-dev zlib1g-dev
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("tests/compat/versions.toml", "rb"))["git"][0]["version"])')
          echo "SLATH_TEST_GIT=$(scripts/install-git.sh "$v")" >> "$GITHUB_ENV"
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: compat-matrix
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just,cargo-nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install the pinned jj versions and the latest jj release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jj=$(just tools | grep '/bin/jj$' | tr '\n' ':')
          latest=$(scripts/install-jj-latest.sh)
          case ":$jj" in *":$latest:"*) ;; *) jj="$jj$latest:" ;; esac
          echo "SLATH_TEST_JJ=${jj%:}" >> "$GITHUB_ENV"
          echo "jj under test: ${jj%:}"
      - run: just web
      - run: cargo build --locked -p slath --bins
      - name: Client suite
        run: cargo nextest run --locked --profile ci -p slath-tests --test compat
      - name: Report
        if: always()
        run: |
          IFS=: read -ra jj <<< "$SLATH_TEST_JJ"
          python3 scripts/compat_report.py --out target/compat-matrix \
            --junit target/nextest/ci/junit.xml --git "$SLATH_TEST_GIT" --jj "${jj[@]}"
          cat target/compat-matrix/report.md >> "$GITHUB_STEP_SUMMARY"
          cp target/nextest/ci/junit.xml target/compat-matrix/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-matrix
          path: target/compat-matrix/
          retention-days: 30
      - name: Open or annotate the tracking issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create compat-matrix --force --color B60205 \
            --description "The nightly Git/jj compatibility matrix is red"
          body="$(cat target/compat-matrix/report.md 2>/dev/null || echo 'The run ended before writing a report.')"
          body="$body"$'\n\n'"Run: $RUN_URL"
          n=$(gh issue list --state open --label compat-matrix --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "The nightly Git/jj compatibility matrix is red" \
              --label compat-matrix --body "$body"
          fi
      - name: Close the tracking issue once green
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --state open --label compat-matrix --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Green again: $RUN_URL"
          done
