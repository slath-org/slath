#
# Signs in through real OpenID Connect providers (Dex and Keycloak in
# containers): the positive counterpart of the mock-provider tests in the
# security suite. Nightly, and on changes to the OIDC code.
name: OIDC providers

on:
  pull_request:
    paths:
      - "crates/auth/src/oidc.rs"
      - "crates/service/src/oidc.rs"
      - "crates/http/src/ui/oidc.rs"
      - "tests/compat/oidc_providers.rs"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  oidc-providers:
    name: sign in with Dex and Keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slath
          POSTGRES_PASSWORD: slath
          POSTGRES_DB: slath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slath -d slath"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://slath:slath@localhost:5432/slath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install newest stable Git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get install -y --no-install-recommends git
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: oidc-providers
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just,cargo-nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: just web
      - run: cargo build --locked -p slath --bins
      - name: Dex and Keycloak sign-in
        run: cargo nextest run --locked -p slath-tests --test compat --run-ignored only -E 'test(/oidc_providers::/)'
