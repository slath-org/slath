name: Feature request
description: Suggest a new feature or a change in behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Slath deliberately keeps its scope small, so please start with the problem you want to solve.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How Slath could solve it. Include how it should work for both Git and jj users, if that matters.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or how other tools solve this.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "No"
        - "Yes, after a maintainer agrees with the approach"
