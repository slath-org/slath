#
# Minimal Slath configuration (/etc/slath/slath.toml). Every key can also be
# set with an environment variable SLATH__<SECTION>__<KEY>. Unknown keys are
# errors; `slath config check` validates the file and the environment.

[server]
# The URL people use to reach Slath (links, cookies, and clone URLs).
public_url = "https://git.example.org"
listen = "127.0.0.1:3000"
# Reverse proxies whose X-Forwarded-For is trusted.
trusted_proxies = ["127.0.0.1/32", "::1/128"]

[database]
# A file holding the connection URL, e.g. postgres://slath:PASSWORD@localhost/slath
url_file = "/etc/slath/db-url"

[storage]
data_dir = "/var/lib/slath"
run_dir = "/run/slath"
# The SSH login's group: its members may connect to the IPC socket in
# run_dir, and nothing else. The slath user must be a member too.
socket_group = "git"

[secrets]
# Create with `slath admin gen-key --output /etc/slath/master.key`.
master_key_file = "/etc/slath/master.key"

[git]
binary = "/usr/bin/git"
ssh_user = "git"
ssh_port = 22

[log]
format = "json"
level = "info"
