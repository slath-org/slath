#
# OpenSSH drop-in for Slath (e.g. /etc/ssh/sshd_config.d/slath.conf).
# Git users connect as `git`. Keys come from `slath ssh-keys`, which asks the
# running `slath serve` over its IPC socket and forces `slath ssh-serve`,
# which hands the session to `slath serve`; Git runs there.
# `git` is a user of its own: it needs no access to Slath's files, only to
# the socket, through its group (`storage.socket_group = "git"`). Nothing
# sshd starts runs as the `slath` service account.

# Global (sshd doesn't allow it inside Match): ignore ~/.ssh/environment.
PermitUserEnvironment no

Match User git
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/bin/slath ssh-keys --socket /run/slath/slath.sock %f
    AuthorizedKeysCommandUser git
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    AcceptEnv GIT_PROTOCOL
