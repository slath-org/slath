#
# OpenSSH drop-in for Slath (e.g. /etc/ssh/sshd_config.d/slath.conf).
# Git users connect as `git`. Keys come from `slath ssh-keys`, which asks the
# running `slath serve` over its IPC socket and forces `slath ssh-serve`.
# `slath` is the service account that owns the socket; `git` must share its
# UID/GID (or group) so ssh-serve can reach the socket and the repositories.

# Global (sshd doesn't allow it inside Match): ignore ~/.ssh/environment.
PermitUserEnvironment no

Match User git
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/bin/slath ssh-keys --socket /run/slath/slath.sock %f
    AuthorizedKeysCommandUser slath
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    AcceptEnv GIT_PROTOCOL
