#
# /usr/lib/sysusers.d/slath.conf: the service account `slath` and the SSH
# login `git`, separate users. Apply with `systemd-sysusers`, then unlock
# `git` for key logins (see docs/admin/install.md). Members of group `git`
# may connect to Slath's IPC socket (`storage.socket_group`); `slath` is one,
# to hand the socket to the group. `git` gets no access to Slath's files.
g slath -
u slath -:slath "Slath" /var/lib/slath /usr/sbin/nologin
g git -
u git -:git "Slath Git over SSH" / /bin/sh
m slath git
