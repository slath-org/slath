#
# /usr/lib/sysusers.d/slath.conf: the service account. Apply with
# `systemd-sysusers`. The SSH login `git` must share its UID (so `slath
# ssh-serve` can reach the socket and the repositories); sysusers can't
# express that, see docs/admin/install.md for the `useradd` command.
g slath -
u slath -:slath "Slath" /var/lib/slath /usr/sbin/nologin
